name: Issue with an exposure
description: Use this form to report an issue with an exposure on the preview site.
title: "[Exposure]: "
labels: ["exposure", "preview-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with an exposure.
        Please include the exposure URL, the browser(s) you were using, and the details of the problem you encountered.

  - type: input
    id: exposure-url
    attributes:
      label: URI of the exposure
      description: This usually takes the form of https://preview.models.physiomeproject.org/exposure/{exposure_id}. You can also point to a specific file or subpath within the exposure.
      placeholder: https://preview.models.physiomeproject.org/exposure/1
    validations:
      required: true

  - type: textarea
    id: exposure-issue
    attributes:
      label: The issue encountered with the exposure
      description: Describe the issue you encountered with the exposure specified above, including what you were trying to do and what happened instead.
      placeholder: |
        - Archive download is corrupted or missing files.
        - Math in the model does not match the paper.
        - Metadata is incomplete, missing, or incorrect.
        - Simulation does not run correctly.
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Which browser(s) were you using when you encountered the issue?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Microsoft Edge
        - Safari
        - Other (please specify)
    validations:
      required: false

  - type: input
    id: browser-other
    attributes:
      label: If you selected "Other", which browser were you using?
      placeholder: e.g. Brave
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we contact you if we need more information?
      placeholder: e.g.,  email@example.com or GitHub username
    validations:
      required: false

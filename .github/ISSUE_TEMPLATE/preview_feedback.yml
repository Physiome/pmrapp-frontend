name: Preview Site Feedback
description: Report a bug or feedback about the preview version of the site.
title: "[Preview Feedback]: "
labels: ["bug", "preview-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve the preview version of the site. Please tell us where the issue occurred and what you expected to happen.

  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: The full URL of the page where you encountered the issue.
      placeholder: https://preview.models.physiomeproject.org/...
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Which browser(s) were you using?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Microsoft Edge
        - Safari
        - Other
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description / Feedback
      description: Please describe what happened, what you expected, and any steps to reproduce it.
      placeholder: |
        - What were you trying to do?
        - What happened instead?
        - What did you expect to happen?
        - If possible, include any error messages or screenshots.
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we contact you if we need more information?
      placeholder: ex. email@example.com or GitHub username
    validations:
      required: false


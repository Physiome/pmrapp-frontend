name: Preview Site Feedback
description: Report a bug or share feedback about the preview site.
title: "[Preview Feedback]: "
labels: ["bug", "preview-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve the preview site.
        Please include the page URL, the browser(s) you were using, the details of the problem you encountered, and what you expected to happen.

  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: The full URL of the page where you encountered the issue.
      placeholder: https://preview.models.physiomeproject.org/...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description / Feedback
      description: Please describe what happened, what you expected, and any steps to reproduce it.
      placeholder: |
        - What were you trying to do?
        - What happened instead?
        - What did you expect to happen?
        - If possible, include any error messages or screenshots.
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Which browser(s) were you using when you encountered the issue?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Microsoft Edge
        - Safari
        - Other (please specify)
    validations:
      required: false

  - type: input
    id: browser-other
    attributes:
      label: If you selected "Other", which browser were you using?
      placeholder: e.g. Brave
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we contact you if we need more information?
      placeholder: e.g.,  email@example.com or GitHub username
    validations:
      required: false


name: CI

on:
  pull_request:
    branches: ['main']

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      # This is a test build, not a deployment: the download and OAuth secrets
      # are intentionally not available on PRs, so bypass the required-variable
      # validation that otherwise fails `vite build`.
      SKIP_ENV_VALIDATION: 'true'
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_PROXY || '' }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format

      - name: Run linter
        run: bun run lint

      - name: Run unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Run e2e tests
        run: bun run test:e2e

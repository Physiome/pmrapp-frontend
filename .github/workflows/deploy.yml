# Workflow for deploying static content to GitHub Pages.
name: Deploy static content to Pages

on:
  # Triggers on pushes targeting the default branch.
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Set the GITHUB_TOKEN permissions to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in progress
# and the latest queued one. In-progress runs are not cancelled, so that a deployment
# that has already started is allowed to finish.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # The build and the deployment are separate jobs, so that the 'github-pages' artifact
  # is fully finalised before deploy-pages looks it up. In a single job the lookup can run
  # within a second of the upload and fail with 'No artifacts named "github-pages" were found'.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
          VITE_ENABLE_GH_PAGES_SPA_REDIRECT: 'true'
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_DOWNLOAD_API: ${{ secrets.VITE_DOWNLOAD_API }}
          VITE_DOWNLOAD_HOST: ${{ secrets.VITE_DOWNLOAD_HOST }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_AUTH_API: ${{ secrets.VITE_GITHUB_AUTH_API }}
          VITE_GITHUB_ISSUES_URL: ${{ vars.VITE_GITHUB_ISSUES_URL }}
          VITE_FEATURE_COMPARISON_SHEET_CSV_URL: ${{ secrets.VITE_FEATURE_COMPARISON_SHEET_CSV_URL }}
          VITE_LOGIN_DISABLED: ${{ vars.VITE_LOGIN_DISABLED || '' }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the dist folder.
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Deploy production static site

on:
  push:
    branches: ['production']

  workflow_dispatch:
    inputs:
      run_deploy:
        description: 'Run deployment job (requires provider-specific commands/configuration)'
        required: true
        type: boolean
        default: false
      deploy_target:
        description: 'Deployment target label for logs'
        required: true
        type: choice
        options:
          - aws-s3-cloudfront
          - vm-nginx-rsync
          - custom
        default: custom

permissions:
  contents: read
  id-token: write

concurrency:
  group: 'production-deploy'
  cancel-in-progress: false

jobs:
  build:
    name: Build production artefact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BASE_PATH: '/'
          VITE_ENABLE_GH_PAGES_SPA_REDIRECT: 'false'
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_DOWNLOAD_API: ${{ secrets.VITE_DOWNLOAD_API }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_AUTH_API: ${{ secrets.VITE_GITHUB_AUTH_API }}
          VITE_GITHUB_ISSUES_URL: ${{ vars.VITE_GITHUB_ISSUES_URL }}
          VITE_FEATURE_COMPARISON_SHEET_CSV_URL: ${{ secrets.VITE_FEATURE_COMPARISON_SHEET_CSV_URL }}
          VITE_LOGIN_DISABLED: ${{ vars.VITE_LOGIN_DISABLED || '' }}

      - name: Upload production artefact
        uses: actions/upload-artifact@v7
        with:
          name: pmrapp-frontend-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production artefact
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_deploy == 'true'
    steps:
      - name: Download production artefact
        uses: actions/download-artifact@v8
        with:
          name: pmrapp-frontend-dist
          path: ./dist

      - name: Deployment placeholder
        run: |
          echo "Deploy target: ${{ github.event.inputs.deploy_target }}"
          echo "The build artefact is available at ./dist"
          echo "Replace this step with provider-specific deployment commands"
          echo "Examples: aws s3 sync, rsync to /var/www, or provider CLI upload"
